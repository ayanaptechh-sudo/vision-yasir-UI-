    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
      // Guard & polyfill for iframe sandbox / container environments where
      // window.fetch is defined as a getter-only property without a setter.
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || realFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // In case the property was already defined with configurable: false
        }

        // Intercept and suppress benign getter-only fetch TypeError from sandboxes/vConsole
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && (msg.indexOf('getter') !== -1 || msg.indexOf('read only') !== -1)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && (event.message.indexOf('getter') !== -1 || event.message.indexOf('read only') !== -1)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        // Theme initialization before first paint to prevent flash
        try {
          var savedTheme = localStorage.getItem('authshield_theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
